<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرة الأعداد - المعلمة عهود حامد الرحيلي</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0fdfa; /* teal-50 */
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Prevent body scrolling */
        }
        
        .btn-3d {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 transparent !important;
        }
        
        .btn-teal {
            background-color: #147971;
            box-shadow: 0 6px 0 #0d5650;
            color: white;
        }
        
        .btn-option {
            background-color: white;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 0 #cbd5e1;
            color: #334155;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        
        /* Signature font simulation */
        .signature {
            font-weight: 900;
            color: #147971;
            font-size: 1.2rem;
        }
    </style>
</head>
<body class="w-full h-[100dvh] flex justify-center bg-gradient-to-b from-teal-50 to-teal-100 text-slate-800">
    
    <div id="root" class="w-full max-w-md h-full relative shadow-2xl bg-teal-50 overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sound Engine
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } else if (type === 'error') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                }
            } catch(e) {
                console.log("Audio not supported or blocked");
            }
        };

        // Confetti Animation Component
        const Confetti = () => {
            return (
                <div className="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-50">
                    {[...Array(25)].map((_, i) => (
                        <div key={i} className="absolute text-2xl animate-bounce" 
                             style={{
                                left: `${Math.random() * 100}%`,
                                top: `${Math.random() * 100}%`,
                                animationDuration: `${Math.random() * 1 + 0.5}s`,
                                animationDelay: `${Math.random() * 0.5}s`
                             }}>⭐</div>
                    ))}
                </div>
            )
        };

        const App = () => {
            const [screen, setScreen] = useState('welcome'); // welcome, map, stage, certificate
            const [studentName, setStudentName] = useState('');
            const [score, setScore] = useState(0);
            const [completedStages, setCompletedStages] = useState([]);
            const [currentStageId, setCurrentStageId] = useState(null);
            const [feedback, setFeedback] = useState(null); // 'correct', 'wrong'

            const stages = [
                { id: 1, type: 'mcq', title: 'حديقة التفاح', question: 'عدّي التفاحات أمامك، ثم اختاري الرقم الصحيح:', options: [5, 7, 8], answer: 7, visuals: '🍎 🍎 🍎 🍎 🍎 🍎 🍎', icon: '🍎' },
                { id: 2, type: 'draw', title: 'أقرأ وأكتب', question: 'اختاري رقماً وتدربي على كتابته بخطك الجميل', icon: '✏️' },
                { id: 3, type: 'mcq', title: 'قطار الأعداد', question: 'ما العدد التالي للعدد ١١؟', options: [10, 12, 13], answer: 12, visuals: '🚂 [ ١٠ ] - [ ١١ ] - [ ❓ ]', icon: '🚂' },
                { id: 4, type: 'mcq', title: 'بستان الأزهار', question: 'اختاري العدد الذي يمثل عدد الأزهار', options: [8, 10, 12], answer: 10, visuals: '🌸🌸🌸🌸🌸🌸🌸🌸🌸🌸', icon: '🌸' },
                { id: 5, type: 'mcq', title: 'سباق السيارات', question: 'أي سيارة تحمل العدد الأكبر؟', options: [13, 18], answer: 18, visuals: '🚗(١٣)  🏎️(١٨)', icon: '🏎️' },
                { id: 6, type: 'mcq', title: 'إشارة المرور', question: 'العددان (١٤) و (١٤) متماثلان. اختاري الرمز المناسب:', options: ['>', '<', '='], answer: '=', icon: '🚦' },
                { id: 7, type: 'mcq', title: 'البالونات', question: 'أي الأعداد أصغر من ١٠؟', options: [9, 11, 12], answer: 9, visuals: '🎈(٩)  🎈(١١)  🎈(١٢)', icon: '🎈' },
                { id: 8, type: 'mcq', title: 'طريق الكنز', question: 'أكملي النمط: ٢، ٤، ٦، ٨، ...', options: [9, 10, 12], answer: 10, visuals: '💎 💎 💎', icon: '💎' },
            ];

            const handleStart = () => {
                playSound('click');
                if (studentName.trim() === '') return;
                setScreen('map');
            };

            const openStage = (id) => {
                playSound('click');
                setCurrentStageId(id);
                setScreen('stage');
            };

            const handleAnswer = (answer, correctAnswer) => {
                if (answer === correctAnswer) {
                    playSound('success');
                    setFeedback('correct');
                    if (!completedStages.includes(currentStageId)) {
                        setScore(s => s + 1);
                        setCompletedStages([...completedStages, currentStageId]);
                    }
                    setTimeout(() => {
                        setFeedback(null);
                        setScreen('map');
                    }, 2000);
                } else {
                    playSound('error');
                    setFeedback('wrong');
                    setTimeout(() => setFeedback(null), 1000);
                }
            };

            const completeDraw = () => {
                 playSound('success');
                 if (!completedStages.includes(currentStageId)) {
                     setScore(s => s + 1);
                     setCompletedStages([...completedStages, currentStageId]);
                 }
                 setScreen('map');
            };

            return (
                <div className="w-full h-full flex flex-col p-4 overflow-y-auto relative">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm mb-4 shrink-0 z-10 relative">
                        <div className="flex items-center gap-3">
                            <div className="bg-teal-100 text-teal-800 font-bold p-3 rounded-xl text-xl">٢٠</div>
                            <div>
                                <h1 className="font-bold text-sm text-slate-800">مغامرة الأعداد</h1>
                                <p className="text-[10px] font-bold text-teal-600 mt-1">إعداد: المعلمة عهود حامد الرحيلي</p>
                            </div>
                        </div>
                        <div className="text-sm font-bold text-teal-600 bg-teal-50 px-3 py-1 rounded-full border border-teal-100">
                            {score} / 8 🌟
                        </div>
                    </div>

                    {/* Content Area */}
                    <div className="flex-1 w-full glass p-6 flex flex-col z-10 relative overflow-hidden">
                        
                        {screen === 'welcome' && (
                            <div className="flex flex-col items-center justify-center flex-1 space-y-6 text-center">
                                <div className="text-7xl mb-2 animate-bounce">🚂</div>
                                <h2 className="text-3xl font-extrabold text-slate-800 leading-tight">
                                    هيا نلعب في<br/>
                                    <span className="text-teal-600">عالم الأعداد!</span>
                                </h2>
                                <p className="text-slate-500 font-bold">رحلة ممتعة للطالبات الذكيات 🌸</p>
                                
                                <div className="w-full mt-6 space-y-4">
                                    <div className="text-right w-full">
                                        <label className="text-sm font-bold text-slate-600 mb-2 block">اسمك الجميل يا بطلة:</label>
                                        <input 
                                            type="text" 
                                            value={studentName}
                                            onChange={e => setStudentName(e.target.value)}
                                            className="w-full p-4 rounded-xl border-2 border-slate-200 focus:border-teal-500 focus:outline-none text-lg font-bold text-slate-700 bg-slate-50"
                                            placeholder="اكتبي اسمك هنا..."
                                        />
                                    </div>
                                    <button 
                                        onClick={handleStart}
                                        disabled={!studentName.trim()}
                                        className="w-full btn-teal btn-3d py-4 rounded-xl font-bold text-xl disabled:opacity-50 disabled:cursor-not-allowed mt-4"
                                    >
                                        ابدئي المغامرة 🚀
                                    </button>
                                </div>
                            </div>
                        )}

                        {screen === 'map' && (
                            <div className="flex flex-col flex-1 h-full">
                                <h2 className="text-xl font-bold text-slate-800 text-center mb-4">خريطة المغامرة يا {studentName}</h2>
                                <div className="grid grid-cols-2 gap-3 flex-1 overflow-y-auto pb-4 pr-1 pl-1 content-start">
                                    {stages.map(st => {
                                        const isDone = completedStages.includes(st.id);
                                        return (
                                            <button 
                                                key={st.id}
                                                onClick={() => openStage(st.id)}
                                                className={`btn-3d p-4 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 aspect-square relative ${
                                                    isDone 
                                                    ? 'bg-teal-50 border-teal-200 text-teal-800' 
                                                    : 'bg-white border-slate-200 text-slate-700 shadow-[0_4px_0_#cbd5e1]'
                                                }`}
                                            >
                                                <span className="text-4xl mb-1">{st.icon}</span>
                                                <span className="font-bold text-sm text-center">{st.title}</span>
                                                {isDone && <span className="absolute top-2 right-2 text-green-500 text-lg drop-shadow-md">✅</span>}
                                            </button>
                                        )
                                    })}
                                </div>
                                {completedStages.length === stages.length && (
                                    <button 
                                        onClick={() => setScreen('certificate')}
                                        className="w-full btn-teal btn-3d py-4 rounded-xl font-bold text-xl mt-4 animate-pulse shrink-0"
                                    >
                                        استلمي الشهادة 🎓
                                    </button>
                                )}
                            </div>
                        )}

                        {screen === 'stage' && currentStageId && (
                            (() => {
                                const stage = stages.find(s => s.id === currentStageId);
                                
                                if (stage.type === 'draw') {
                                    return <DrawStage stage={stage} onComplete={completeDraw} />
                                }

                                return (
                                    <div className="flex flex-col flex-1 items-center relative h-full">
                                        {feedback === 'correct' && <Confetti />}
                                        
                                        <div className="flex-1 w-full flex flex-col items-center justify-center">
                                            <h2 className="text-2xl font-bold text-slate-800 text-center mb-4">{stage.title}</h2>
                                            <p className="text-lg text-slate-600 text-center mb-6 font-bold bg-slate-50 p-4 rounded-2xl w-full border border-slate-100">{stage.question}</p>
                                            
                                            {stage.visuals && (
                                                <div className="text-4xl mb-8 text-center bg-white p-6 rounded-3xl shadow-sm border-2 border-slate-100 w-full" style={{letterSpacing: '0.2em'}}>
                                                    {stage.visuals}
                                                </div>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-3 gap-3 w-full shrink-0">
                                            {stage.options.map((opt, i) => (
                                                <button 
                                                    key={i}
                                                    onClick={() => handleAnswer(opt, stage.answer)}
                                                    className="btn-option btn-3d py-5 rounded-2xl font-bold text-3xl"
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        {feedback === 'correct' && <div className="absolute inset-0 bg-white/90 flex flex-col items-center justify-center text-4xl font-bold text-green-500 z-40 rounded-2xl backdrop-blur-sm shadow-xl"><span>🌟</span><span className="mt-4">إجابة صحيحة!</span></div>}
                                        {feedback === 'wrong' && <div className="absolute inset-0 bg-white/90 flex flex-col items-center justify-center text-4xl font-bold text-red-500 z-40 rounded-2xl backdrop-blur-sm shadow-xl"><span>💪</span><span className="mt-4">حاولي مرة أخرى</span></div>}
                                        
                                        <button onClick={() => setScreen('map')} className="text-slate-400 font-bold mt-6 py-2 px-6 rounded-full hover:bg-slate-50">العودة للخريطة</button>
                                    </div>
                                );
                            })()
                        )}

                        {screen === 'certificate' && (
                            <div className="flex flex-col flex-1 items-center justify-center text-center relative border-8 border-teal-100 bg-white rounded-3xl p-6 shadow-inner h-full">
                                <Confetti />
                                <div className="text-7xl mb-4 drop-shadow-md">🏆</div>
                                <h2 className="text-3xl font-extrabold text-teal-700 mb-2">شهادة تفوق</h2>
                                <p className="text-slate-500 font-bold mb-6">تُمنح بكل فخر واعتزاز للطالبة المتميزة</p>
                                
                                <div className="bg-teal-50 border-2 border-teal-100 px-8 py-5 rounded-2xl w-full mb-6 shadow-sm transform -rotate-1">
                                    <h3 className="text-4xl font-black text-slate-800">{studentName}</h3>
                                </div>
                                
                                <p className="text-slate-600 font-medium mb-8 text-sm leading-relaxed">
                                    لاجتيازها جميع مراحل مغامرة الأعداد<br/>بتميز وإبداع! 🌟
                                </p>
                                
                                <div className="w-full flex justify-between items-end mt-auto border-t-2 border-dashed border-teal-200 pt-4 px-2">
                                    <div className="text-right">
                                        <p className="text-xs text-slate-400 mb-1 font-bold">المعلمة:</p>
                                        <p className="signature">عهود حامد الرحيلي</p>
                                    </div>
                                    <div className="bg-amber-100 text-amber-600 p-2 rounded-full shadow-sm">
                                        <span className="text-2xl">🏅</span>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => {
                                        setScreen('welcome');
                                        setCompletedStages([]);
                                        setScore(0);
                                        setStudentName('');
                                    }}
                                    className="absolute -bottom-16 text-teal-700 font-bold bg-white px-6 py-2 rounded-full shadow-md border border-teal-100"
                                >
                                    العب من جديد 🔄
                                </button>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const DrawStage = ({stage, onComplete}) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [selectedNum, setSelectedNum] = useState(null);

            useEffect(() => {
                if (selectedNum && canvasRef.current && containerRef.current) {
                    const canvas = canvasRef.current;
                    const container = containerRef.current;
                    // Match canvas internal size to its display size for correct coordinates
                    canvas.width = container.offsetWidth;
                    canvas.height = container.offsetHeight;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = 14;
                    ctx.strokeStyle = '#147971';
                }
            }, [selectedNum]);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const stopDrawing = () => {
                setIsDrawing(false);
                if (canvasRef.current) {
                    canvasRef.current.getContext('2d').beginPath();
                }
            };

            const draw = (e) => {
                if (!isDrawing) return;
                // Prevent scrolling while drawing on touch devices
                if (e.cancelable) {
                     e.preventDefault();
                }
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            return (
                <div className="flex flex-col flex-1 items-center h-full w-full">
                    <h2 className="text-2xl font-bold text-slate-800 text-center mb-2">{stage.title}</h2>
                    
                    {!selectedNum ? (
                        <div className="flex-1 flex flex-col w-full overflow-hidden">
                            <p className="text-sm text-slate-500 font-bold text-center mb-4">{stage.question}</p>
                            <div className="grid grid-cols-5 gap-3 overflow-y-auto p-1 pb-4 flex-1 content-start">
                                {[...Array(21)].map((_, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => {
                                            playSound('click');
                                            setSelectedNum(i.toString());
                                        }}
                                        className="btn-option rounded-xl py-4 font-bold text-xl btn-3d"
                                    >
                                        {i}
                                    </button>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col flex-1 w-full items-center h-full">
                            <div className="flex justify-between w-full mb-4 px-2">
                                <button onClick={() => setSelectedNum(null)} className="text-sm text-slate-400 font-bold bg-slate-100 px-4 py-2 rounded-lg">العودة للأرقام</button>
                                <button onClick={clearCanvas} className="text-sm text-red-500 font-bold bg-red-50 px-4 py-2 rounded-lg">مسح السبورة 🧹</button>
                            </div>
                            
                            <div ref={containerRef} className="relative bg-white border-4 border-slate-200 rounded-3xl w-full flex-1 shadow-inner overflow-hidden touch-none">
                                <div className="absolute inset-0 flex items-center justify-center text-[180px] font-black text-slate-100 select-none pointer-events-none">
                                    {selectedNum}
                                </div>
                                <canvas 
                                    ref={canvasRef}
                                    className="absolute inset-0 w-full h-full cursor-crosshair z-10"
                                    onMouseDown={startDrawing}
                                    onMouseUp={stopDrawing}
                                    onMouseOut={stopDrawing}
                                    onMouseMove={draw}
                                    onTouchStart={startDrawing}
                                    onTouchEnd={stopDrawing}
                                    onTouchMove={draw}
                                />
                            </div>
                            
                            <button 
                                onClick={onComplete}
                                className="w-full btn-teal btn-3d py-4 rounded-xl font-bold text-xl mt-4 shrink-0"
                            >
                                أنهيت الكتابة ✅
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
