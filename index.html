<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرة الأعداد المرحة - تأسيس</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', 'Fredoka', sans-serif;
            background-color: #fdf2f8; /* pink-50 */
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            background-image: radial-gradient(#fbcfe8 20%, transparent 20%), radial-gradient(#fbcfe8 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }
        
        .cartoon-container {
            background: linear-gradient(180deg, #ffffff 0%, #f3f4f6 100%);
            border-radius: 40px;
            border: 8px solid white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .btn-cartoon {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom-width: 6px;
            border-style: solid;
        }
        
        .btn-cartoon:active:not(:disabled) {
            transform: translateY(6px);
            border-bottom-width: 0px;
            margin-top: 6px;
        }

        .btn-cartoon:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            border-bottom-width: 6px;
            margin-top: 0px;
        }

        .btn-option {
            background-color: white;
            border: 4px solid #e5e7eb;
            color: #4b5563;
            border-radius: 24px;
            transition: all 0.2s;
        }

        .btn-option.selected {
            border-color: #a855f7; /* purple-500 */
            background-color: #faf5ff; /* purple-50 */
            color: #7e22ce;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
        }

        /* Animations */
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-gentle { animation: bounce-gentle 2s infinite ease-in-out; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-2deg); }
            75% { transform: translateX(8px) rotate(2deg); }
        }
        .animate-shake { animation: shake 0.4s; }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .signature {
            font-family: 'Fredoka', cursive;
            font-weight: 700;
            color: #ec4899; /* pink-500 */
            font-size: 1.3rem;
            transform: rotate(-3deg);
            display: inline-block;
        }
    </style>
</head>
<body class="w-full h-[100dvh] flex justify-center items-center p-2 sm:p-4 text-slate-800">
    
    <div id="root" class="w-full max-w-md h-full relative cartoon-container overflow-hidden flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sound Engine
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                } else if (type === 'error') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                }
            } catch(e) {
                console.log("Audio not supported");
            }
        };

        const Confetti = () => {
            return (
                <div className="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-50">
                    {[...Array(25)].map((_, i) => (
                        <div key={i} className="absolute text-4xl animate-pop" 
                             style={{
                                left: `${Math.random() * 100}%`,
                                top: `${Math.random() * 100}%`,
                                animationDuration: `${Math.random() * 0.5 + 0.5}s`,
                                animationDelay: `${Math.random() * 0.3}s`
                             }}>
                             {['✨', '🌟', '🎉', '🎈'][Math.floor(Math.random() * 4)]}
                        </div>
                    ))}
                </div>
            )
        };

        const App = () => {
            const [screen, setScreen] = useState('welcome');
            const [studentName, setStudentName] = useState('');
            const [score, setScore] = useState(0);
            const [completedStages, setCompletedStages] = useState([]);
            const [currentStageId, setCurrentStageId] = useState(null);

            // Foundational stages from zero (Numbers 1-10) - Same Logic!
            const stages = [
                { id: 1, type: 'count', title: 'حديقة التفاح', question: 'اضغطي على التفاحات لتعدّيها، ثم اختاري الرقم الصحيح:', targetCount: 4, options: [3, 4, 5], answer: 4, icon: '🍎', color: 'bg-red-100 border-red-300 text-red-700' },
                { id: 2, type: 'draw', title: 'أقرأ وأكتب', question: 'اختاري رقماً وتتبعي مساره لتتعلمي كتابته:', icon: '✏️', color: 'bg-purple-100 border-purple-300 text-purple-700' },
                { id: 3, type: 'mcq', title: 'قطار الأعداد', question: 'ما العدد الذي يركب في العربة الفارغة؟', options: [2, 3, 4], answer: 3, visuals: '🚂 [ ١ ] - [ ٢ ] - [ ❓ ]', icon: '🚂', color: 'bg-blue-100 border-blue-300 text-blue-700' },
                { id: 4, type: 'count', title: 'بستان الأزهار', question: 'كم زهرة لدينا؟ اضغطي عليها لتعديها:', targetCount: 5, options: [4, 5, 6], answer: 5, icon: '🌸', color: 'bg-pink-100 border-pink-300 text-pink-700' },
                { id: 5, type: 'visual_mcq', title: 'سباق السيارات', question: 'أي سيارة تحمل العدد الأكبر؟ (عدي النقاط)', options: [6, 3], answer: 6, icon: '🏎️', visualsData: [ {num: 6, emoji: '🔴'}, {num: 3, emoji: '🔵'} ], color: 'bg-orange-100 border-orange-300 text-orange-700' },
                { id: 6, type: 'mcq', title: 'إشارة المرور', question: 'العددان (٤) و (٤) متماثلان. اختاري الرمز المناسب:', options: ['>', '<', '='], answer: '=', icon: '🚦', color: 'bg-emerald-100 border-emerald-300 text-emerald-700' },
                { id: 7, type: 'mcq', title: 'البالونات', question: 'اختاري البالون الذي يحمل رقماً أصغر من ٣:', options: [2, 4, 5], answer: 2, visuals: '🎈(٢)  🎈(٤)  🎈(٥)', icon: '🎈', color: 'bg-cyan-100 border-cyan-300 text-cyan-700' },
                { id: 8, type: 'mcq', title: 'طريق الكنز', question: 'رتبي الجواهر لتصلي للكنز: ١، ٢، ٣، ...', options: [4, 5, 6], answer: 4, visuals: '💎[١] 💎[٢] 💎[٣] 💎[❓]', icon: '💎', color: 'bg-amber-100 border-amber-300 text-amber-700' },
            ];

            const handleStart = () => {
                playSound('pop');
                if (studentName.trim() === '') return;
                setScreen('map');
            };

            const openStage = (id) => {
                playSound('click');
                setCurrentStageId(id);
                setScreen('stage');
            };

            const markStageComplete = (id) => {
                if (!completedStages.includes(id)) {
                    setScore(s => s + 1);
                    setCompletedStages([...completedStages, id]);
                }
                setScreen('map');
            };

            return (
                <div className="w-full h-full flex flex-col relative">
                    
                    {/* Header (hidden in welcome & cert screens) */}
                    {screen !== 'welcome' && screen !== 'certificate' && (
                        <div className="bg-white/80 backdrop-blur-md p-4 flex justify-between items-center border-b-4 border-slate-100 shrink-0 z-20">
                            <div className="flex items-center gap-3">
                                <div className="bg-pink-100 text-pink-600 font-black px-4 py-2 rounded-2xl text-xl border-2 border-pink-200 shadow-inner">١٠</div>
                                <div>
                                    <h1 className="font-black text-sm text-slate-700">التأسيس الممتع</h1>
                                    <p className="text-[10px] font-bold text-slate-400 mt-1">المعلمة عهود حامد الرحيلي</p>
                                </div>
                            </div>
                            <div className="text-sm font-black text-amber-500 bg-amber-50 px-4 py-2 rounded-2xl border-2 border-amber-200 shadow-inner flex items-center gap-1">
                                <span>{score}/8</span> <span>⭐</span>
                            </div>
                        </div>
                    )}

                    {/* Content Area */}
                    <div className="flex-1 w-full flex flex-col z-10 relative overflow-hidden p-4">
                        
                        {screen === 'welcome' && (
                            <div className="flex flex-col items-center justify-center flex-1 text-center relative z-10">
                                <div className="text-8xl mb-4 animate-bounce-gentle drop-shadow-xl">🧸</div>
                                
                                <div className="bg-white p-6 rounded-[32px] border-4 border-pink-200 shadow-xl w-full max-w-sm relative">
                                    {/* Decorative dots */}
                                    <div className="absolute -top-3 -right-3 w-6 h-6 bg-yellow-400 rounded-full"></div>
                                    <div className="absolute -bottom-3 -left-3 w-8 h-8 bg-blue-400 rounded-full"></div>
                                    
                                    <h2 className="text-3xl font-black text-pink-500 mb-2 drop-shadow-sm leading-tight">
                                        مرحباً بك في<br/>عالم الأعداد!
                                    </h2>
                                    <p className="text-slate-500 font-bold mb-6 text-sm">ألعاب تأسيسية ممتعة للطالبات 🌸</p>
                                    
                                    <div className="text-right w-full mb-6">
                                        <label className="text-sm font-black text-slate-600 mb-2 block px-2">يا بطلة، ما اسمك؟</label>
                                        <input 
                                            type="text" 
                                            value={studentName}
                                            onChange={e => setStudentName(e.target.value)}
                                            className="w-full p-4 rounded-2xl border-4 border-slate-100 focus:border-pink-400 focus:outline-none text-xl font-black text-slate-700 bg-slate-50 text-center"
                                            placeholder="اكتبي اسمك..."
                                        />
                                    </div>
                                    <button 
                                        onClick={handleStart}
                                        disabled={!studentName.trim()}
                                        className="w-full bg-yellow-400 border-yellow-500 text-yellow-900 btn-cartoon py-4 rounded-2xl font-black text-2xl"
                                    >
                                        يلا نلعب! 🚀
                                    </button>
                                </div>
                            </div>
                        )}

                        {screen === 'map' && (
                            <div className="flex flex-col flex-1 h-full">
                                <h2 className="text-xl font-black text-slate-700 text-center mb-4 bg-white/60 rounded-full py-2">خريطة اللعب يا {studentName} 🗺️</h2>
                                <div className="grid grid-cols-2 gap-4 flex-1 overflow-y-auto pb-4 pr-1 pl-1 content-start">
                                    {stages.map(st => {
                                        const isDone = completedStages.includes(st.id);
                                        return (
                                            <button 
                                                key={st.id}
                                                onClick={() => openStage(st.id)}
                                                className={`btn-cartoon p-4 rounded-[28px] border-4 flex flex-col items-center justify-center gap-3 aspect-square relative ${
                                                    isDone 
                                                    ? 'bg-slate-50 border-slate-200 text-slate-400 opacity-80' 
                                                    : st.color
                                                }`}
                                            >
                                                <span className={`text-5xl ${isDone ? 'grayscale' : 'animate-bounce-gentle drop-shadow-md'}`}>{st.icon}</span>
                                                <span className="font-black text-sm text-center leading-tight">{st.title}</span>
                                                {isDone && <span className="absolute -top-2 -right-2 text-green-500 text-3xl drop-shadow-md bg-white rounded-full">✅</span>}
                                            </button>
                                        )
                                    })}
                                </div>
                                {completedStages.length === stages.length && (
                                    <button 
                                        onClick={() => { playSound('success'); setScreen('certificate'); }}
                                        className="w-full bg-purple-500 border-purple-600 text-white btn-cartoon py-5 rounded-[24px] font-black text-2xl mt-4 animate-pulse shrink-0"
                                    >
                                        استلمي هديتك! 🎁
                                    </button>
                                )}
                            </div>
                        )}

                        {screen === 'stage' && currentStageId && (
                            <StageEngine 
                                stage={stages.find(s => s.id === currentStageId)} 
                                onComplete={() => markStageComplete(currentStageId)}
                                onBack={() => setScreen('map')}
                            />
                        )}

                        {screen === 'certificate' && (
                            <div className="flex flex-col flex-1 items-center justify-center text-center relative bg-white rounded-[32px] p-6 border-4 border-pink-200 shadow-inner h-full">
                                <Confetti />
                                <div className="text-8xl mb-4 drop-shadow-xl animate-bounce-gentle">👑</div>
                                <h2 className="text-4xl font-black text-pink-500 mb-2">أنتِ بطلة!</h2>
                                <p className="text-slate-500 font-bold mb-6 text-lg">تأسستي في الأرقام بذكاء</p>
                                
                                <div className="bg-purple-100 border-4 border-purple-200 px-8 py-6 rounded-[28px] w-full mb-8 transform -rotate-3 shadow-sm">
                                    <h3 className="text-4xl font-black text-purple-700">{studentName}</h3>
                                </div>
                                
                                <div className="w-full flex justify-between items-center border-t-4 border-dashed border-slate-100 pt-6 px-4">
                                    <div className="text-right">
                                        <p className="text-sm text-slate-400 mb-1 font-bold">المعلمة الفخورة بك:</p>
                                        <p className="signature">عهود حامد الرحيلي</p>
                                    </div>
                                    <div className="text-5xl">🏅</div>
                                </div>
                                
                                <button 
                                    onClick={() => {
                                        setScreen('map');
                                        setCompletedStages([]);
                                        setScore(0);
                                    }}
                                    className="absolute -bottom-8 bg-yellow-400 border-yellow-500 text-yellow-900 border-b-4 font-black px-8 py-4 rounded-full shadow-lg text-xl active:translate-y-1 active:border-b-0"
                                >
                                    نلعب مرة ثانية؟ 🔄
                                </button>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        // Unified Stage Engine (Logic preserved, UI made playful)
        const StageEngine = ({ stage, onComplete, onBack }) => {
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [status, setStatus] = useState('idle'); // idle, correct, wrong
            
            // For counting stages
            const [countedItems, setCountedItems] = useState([]);

            const handleCheck = () => {
                if (selectedOpt === null) return;
                
                if (selectedOpt === stage.answer) {
                    playSound('success');
                    setStatus('correct');
                    setTimeout(() => {
                        onComplete();
                    }, 2000);
                } else {
                    playSound('error');
                    setStatus('wrong');
                    setTimeout(() => setStatus('idle'), 1000);
                }
            };

            const handleItemClick = (index) => {
                if (!countedItems.includes(index)) {
                    playSound('pop');
                    setCountedItems([...countedItems, index]);
                }
            };

            if (stage.type === 'draw') {
                return <DrawStage stage={stage} onComplete={onComplete} onBack={onBack} />
            }

            return (
                <div className="flex flex-col flex-1 items-center relative h-full w-full">
                    {status === 'correct' && <Confetti />}
                    
                    <div className="flex-1 w-full flex flex-col items-center">
                        <div className="w-full flex justify-between items-center mb-4">
                            <button onClick={onBack} className="text-2xl bg-white border-4 border-slate-200 w-12 h-12 rounded-full flex items-center justify-center shadow-sm active:scale-95 transition-transform">🔙</button>
                            <h2 className="text-2xl font-black text-slate-700 text-center flex-1">{stage.title}</h2>
                            <div className="w-12"></div>
                        </div>
                        
                        {/* Playful Speech Bubble */}
                        <div className="relative bg-white border-4 border-blue-200 p-4 rounded-[28px] w-full mb-6 shadow-sm">
                            <p className="text-base text-slate-700 text-center font-black">
                                {stage.question}
                            </p>
                            <div className="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-6 h-6 bg-white border-b-4 border-r-4 border-blue-200 rotate-45"></div>
                        </div>
                        
                        {/* Visuals rendering based on stage type */}
                        <div className="flex-1 flex flex-col justify-center w-full min-h-[160px] bg-white/50 rounded-[32px] p-4 mb-4">
                            {stage.type === 'count' && (
                                <div className="flex flex-wrap justify-center gap-4">
                                    {[...Array(stage.targetCount)].map((_, i) => {
                                        const isCounted = countedItems.includes(i);
                                        return (
                                            <div 
                                                key={i} 
                                                onClick={() => handleItemClick(i)}
                                                className={`relative cursor-pointer transition-all duration-300 text-6xl flex items-center justify-center w-20 h-20 ${isCounted ? 'scale-110' : 'hover:scale-105 animate-bounce-gentle drop-shadow-md'}`}
                                            >
                                                <span className={isCounted ? 'opacity-30 grayscale' : 'opacity-100'}>{stage.icon}</span>
                                                {isCounted && <span className="absolute text-3xl font-black text-pink-500 bg-white border-4 border-pink-200 rounded-full w-12 h-12 flex items-center justify-center shadow-lg animate-pop">{i + 1}</span>}
                                            </div>
                                        )
                                    })}
                                </div>
                            )}

                            {stage.type === 'visual_mcq' && (
                                <div className="flex justify-around items-end w-full gap-4">
                                    {stage.visualsData.map((v, i) => (
                                        <div key={i} className="flex flex-col items-center bg-white p-4 rounded-3xl border-4 border-slate-100 w-1/2 shadow-sm">
                                            <div className="text-5xl mb-3 drop-shadow-sm">{stage.icon}</div>
                                            <div className="flex flex-wrap justify-center gap-2 w-full mt-2">
                                                {[...Array(v.num)].map((_, idx) => <span key={idx} className="text-lg">{v.emoji}</span>)}
                                            </div>
                                            <div className="mt-3 text-lg font-black text-slate-400 bg-slate-50 px-4 py-1 rounded-full">{v.num}</div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {stage.visuals && (
                                <div className="text-3xl sm:text-4xl text-center font-black drop-shadow-md" style={{letterSpacing: '0.15em', wordSpacing: '0.2em'}}>
                                    {stage.visuals}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="w-full shrink-0 flex flex-col gap-4 mt-auto">
                        <div className="grid grid-cols-3 gap-3 w-full">
                            {stage.options.map((opt, i) => (
                                <button 
                                    key={i}
                                    onClick={() => {
                                        playSound('click');
                                        setSelectedOpt(opt);
                                    }}
                                    className={`btn-option py-5 font-black text-3xl ${selectedOpt === opt ? 'selected' : ''}`}
                                >
                                    {opt}
                                </button>
                            ))}
                        </div>

                        <button 
                            onClick={handleCheck}
                            disabled={selectedOpt === null || status === 'correct'}
                            className={`w-full py-5 rounded-2xl font-black text-2xl text-white btn-cartoon
                                ${status === 'wrong' ? 'animate-shake bg-red-500 border-red-600' : 'bg-green-400 border-green-500'}
                            `}
                        >
                            {status === 'wrong' ? 'حاولي مرة أخرى ❌' : 'تحقق من إجابتي ✅'}
                        </button>
                    </div>

                    {status === 'correct' && (
                        <div className="absolute inset-0 bg-white/80 flex flex-col items-center justify-center z-40 rounded-[32px] backdrop-blur-sm animate-pop">
                            <div className="bg-green-100 border-4 border-green-300 p-8 rounded-[40px] text-center shadow-2xl">
                                <div className="text-7xl mb-4">🌟</div>
                                <div className="text-3xl font-black text-green-600">أحسنتِ بطلة!</div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const DrawStage = ({stage, onComplete, onBack}) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [selectedNum, setSelectedNum] = useState(null);

            useEffect(() => {
                if (selectedNum && canvasRef.current && containerRef.current) {
                    const canvas = canvasRef.current;
                    const container = containerRef.current;
                    canvas.width = container.offsetWidth;
                    canvas.height = container.offsetHeight;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = 20; // Thicker playful line
                    ctx.strokeStyle = '#ec4899'; // Pink playful color
                }
            }, [selectedNum]);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const stopDrawing = () => {
                setIsDrawing(false);
                if (canvasRef.current) {
                    canvasRef.current.getContext('2d').beginPath();
                }
            };

            const draw = (e) => {
                if (!isDrawing) return;
                if (e.cancelable) e.preventDefault();
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            return (
                <div className="flex flex-col flex-1 items-center h-full w-full">
                    <div className="w-full flex justify-between items-center mb-4">
                        <button onClick={onBack} className="text-2xl bg-white border-4 border-slate-200 w-12 h-12 rounded-full flex items-center justify-center shadow-sm active:scale-95 transition-transform">🔙</button>
                        <h2 className="text-2xl font-black text-slate-700 text-center flex-1">{stage.title}</h2>
                        <div className="w-12"></div>
                    </div>
                    
                    {!selectedNum ? (
                        <div className="flex-1 flex flex-col w-full overflow-hidden">
                            <div className="relative bg-white border-4 border-blue-200 p-4 rounded-[28px] w-full mb-6 shadow-sm">
                                <p className="text-base text-slate-700 text-center font-black">{stage.question}</p>
                            </div>
                            <div className="grid grid-cols-3 gap-3 overflow-y-auto p-1 pb-4 flex-1 content-start">
                                {[...Array(9)].map((_, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => {
                                            playSound('pop');
                                            setSelectedNum((i+1).toString());
                                        }}
                                        className="btn-option rounded-[24px] py-6 font-black text-4xl hover:scale-105"
                                    >
                                        {i+1}
                                    </button>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col flex-1 w-full items-center h-full">
                            <div className="flex justify-between w-full mb-3 px-1 gap-2">
                                <button onClick={() => setSelectedNum(null)} className="text-sm text-slate-600 font-black bg-white border-4 border-slate-200 px-4 py-3 rounded-2xl flex-1 active:scale-95 transition-transform">تغيير الرقم 🔄</button>
                                <button onClick={clearCanvas} className="text-sm text-red-500 font-black bg-red-50 border-4 border-red-200 px-4 py-3 rounded-2xl flex-1 active:scale-95 transition-transform">امسح وارسم 🧹</button>
                            </div>
                            
                            <div ref={containerRef} className="relative bg-white border-8 border-dashed border-pink-200 rounded-[40px] w-full flex-1 shadow-inner overflow-hidden touch-none mb-4 cursor-crosshair">
                                <div className="absolute inset-0 flex items-center justify-center text-[180px] font-black text-slate-100 select-none pointer-events-none">
                                    {selectedNum}
                                </div>
                                <canvas 
                                    ref={canvasRef}
                                    className="absolute inset-0 w-full h-full z-10"
                                    onMouseDown={startDrawing}
                                    onMouseUp={stopDrawing}
                                    onMouseOut={stopDrawing}
                                    onMouseMove={draw}
                                    onTouchStart={startDrawing}
                                    onTouchEnd={stopDrawing}
                                    onTouchMove={draw}
                                />
                            </div>
                            
                            <button 
                                onClick={() => {
                                    playSound('success');
                                    onComplete();
                                }}
                                className="w-full bg-green-400 border-green-500 text-white btn-cartoon py-5 rounded-[24px] font-black text-2xl shrink-0"
                            >
                                أنهيت الكتابة ✅
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
