<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرة الأعداد - تأسيس من الصفر</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0fdfa; /* teal-50 */
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        
        .btn-3d {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0px 0 transparent !important;
        }
        
        .btn-teal {
            background-color: #147971;
            box-shadow: 0 6px 0 #0d5650;
            color: white;
        }
        
        .btn-teal:disabled {
            background-color: #94a3b8;
            box-shadow: 0 6px 0 #64748b;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-option {
            background-color: white;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 0 #cbd5e1;
            color: #334155;
            transition: all 0.2s;
        }

        .btn-option.selected {
            border-color: #147971;
            background-color: #f0fdfa;
            box-shadow: 0 0px 0 transparent, inset 0 0 0 2px #147971;
            transform: translateY(4px);
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.4s; }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Signature font simulation */
        .signature {
            font-weight: 900;
            color: #147971;
            font-size: 1.2rem;
        }
    </style>
</head>
<body class="w-full h-[100dvh] flex justify-center bg-gradient-to-b from-teal-50 to-teal-100 text-slate-800">
    
    <div id="root" class="w-full max-w-md h-full relative shadow-2xl bg-teal-50 overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sound Engine
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } else if (type === 'error') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                } else if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                }
            } catch(e) {
                console.log("Audio not supported");
            }
        };

        const Confetti = () => {
            return (
                <div className="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-50">
                    {[...Array(25)].map((_, i) => (
                        <div key={i} className="absolute text-2xl animate-bounce" 
                             style={{
                                left: `${Math.random() * 100}%`,
                                top: `${Math.random() * 100}%`,
                                animationDuration: `${Math.random() * 1 + 0.5}s`,
                                animationDelay: `${Math.random() * 0.5}s`
                             }}>⭐</div>
                    ))}
                </div>
            )
        };

        const App = () => {
            const [screen, setScreen] = useState('welcome');
            const [studentName, setStudentName] = useState('');
            const [score, setScore] = useState(0);
            const [completedStages, setCompletedStages] = useState([]);
            const [currentStageId, setCurrentStageId] = useState(null);

            // Foundational stages from zero (Numbers 1-10)
            const stages = [
                { id: 1, type: 'count', title: 'حديقة التفاح', question: 'اضغطي على التفاحات لتعدّيها، ثم اختاري الرقم الصحيح:', targetCount: 4, options: [3, 4, 5], answer: 4, icon: '🍎' },
                { id: 2, type: 'draw', title: 'أقرأ وأكتب', question: 'اختاري رقماً وتتبعي مساره لتتعلمي كتابته:', icon: '✏️' },
                { id: 3, type: 'mcq', title: 'قطار الأعداد', question: 'ما العدد الذي يركب في العربة الفارغة؟', options: [2, 3, 4], answer: 3, visuals: '🚂 [ ١ ] - [ ٢ ] - [ ❓ ]', icon: '🚂' },
                { id: 4, type: 'count', title: 'بستان الأزهار', question: 'كم زهرة لدينا؟ اضغطي عليها لتعديها:', targetCount: 5, options: [4, 5, 6], answer: 5, icon: '🌸' },
                { id: 5, type: 'visual_mcq', title: 'سباق السيارات', question: 'أي سيارة تحمل العدد الأكبر؟ (عدي النقاط)', options: [6, 3], answer: 6, icon: '🏎️', visualsData: [ {num: 6, emoji: '🔴'}, {num: 3, emoji: '🔵'} ] },
                { id: 6, type: 'mcq', title: 'إشارة المرور', question: 'العددان (٤) و (٤) متماثلان. اختاري الرمز المناسب:', options: ['>', '<', '='], answer: '=', icon: '🚦' },
                { id: 7, type: 'mcq', title: 'البالونات', question: 'اختاري البالون الذي يحمل رقماً أصغر من ٣:', options: [2, 4, 5], answer: 2, visuals: '🎈(٢)  🎈(٤)  🎈(٥)', icon: '🎈' },
                { id: 8, type: 'mcq', title: 'طريق الكنز', question: 'رتبي الجواهر لتصلي للكنز: ١، ٢، ٣، ...', options: [4, 5, 6], answer: 4, visuals: '💎[١] 💎[٢] 💎[٣] 💎[❓]', icon: '💎' },
            ];

            const handleStart = () => {
                playSound('click');
                if (studentName.trim() === '') return;
                setScreen('map');
            };

            const openStage = (id) => {
                playSound('click');
                setCurrentStageId(id);
                setScreen('stage');
            };

            const markStageComplete = (id) => {
                if (!completedStages.includes(id)) {
                    setScore(s => s + 1);
                    setCompletedStages([...completedStages, id]);
                }
                setScreen('map');
            };

            return (
                <div className="w-full h-full flex flex-col p-4 overflow-y-auto relative">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm mb-4 shrink-0 z-10 relative">
                        <div className="flex items-center gap-3">
                            <div className="bg-teal-100 text-teal-800 font-bold p-3 rounded-xl text-xl">١٠</div>
                            <div>
                                <h1 className="font-bold text-sm text-slate-800">التأسيس من الصفر</h1>
                                <p className="text-[10px] font-bold text-teal-600 mt-1">إعداد: المعلمة عهود حامد الرحيلي</p>
                            </div>
                        </div>
                        <div className="text-sm font-bold text-teal-600 bg-teal-50 px-3 py-1 rounded-full border border-teal-100">
                            {score} / 8 🌟
                        </div>
                    </div>

                    {/* Content Area */}
                    <div className="flex-1 w-full glass p-4 flex flex-col z-10 relative overflow-hidden">
                        
                        {screen === 'welcome' && (
                            <div className="flex flex-col items-center justify-center flex-1 space-y-6 text-center">
                                <div className="text-7xl mb-2 animate-bounce">🌱</div>
                                <h2 className="text-3xl font-extrabold text-slate-800 leading-tight">
                                    هيا نتأسس في<br/>
                                    <span className="text-teal-600">عالم الأعداد!</span>
                                </h2>
                                <p className="text-slate-500 font-bold px-4">رحلة ممتعة للطالبات للبدء من الصفر وتعلم الأرقام بذكاء 🌸</p>
                                
                                <div className="w-full mt-6 space-y-4 px-2">
                                    <div className="text-right w-full">
                                        <label className="text-sm font-bold text-slate-600 mb-2 block">اسمك الجميل يا بطلة:</label>
                                        <input 
                                            type="text" 
                                            value={studentName}
                                            onChange={e => setStudentName(e.target.value)}
                                            className="w-full p-4 rounded-xl border-2 border-slate-200 focus:border-teal-500 focus:outline-none text-lg font-bold text-slate-700 bg-slate-50"
                                            placeholder="اكتبي اسمك هنا..."
                                        />
                                    </div>
                                    <button 
                                        onClick={handleStart}
                                        disabled={!studentName.trim()}
                                        className="w-full btn-teal btn-3d py-4 rounded-xl font-bold text-xl disabled:opacity-50 disabled:cursor-not-allowed mt-4"
                                    >
                                        ابدئي الرحلة 🚀
                                    </button>
                                </div>
                            </div>
                        )}

                        {screen === 'map' && (
                            <div className="flex flex-col flex-1 h-full">
                                <h2 className="text-lg font-bold text-slate-800 text-center mb-4">خريطة التعلم يا {studentName}</h2>
                                <div className="grid grid-cols-2 gap-3 flex-1 overflow-y-auto pb-4 pr-1 pl-1 content-start">
                                    {stages.map(st => {
                                        const isDone = completedStages.includes(st.id);
                                        return (
                                            <button 
                                                key={st.id}
                                                onClick={() => openStage(st.id)}
                                                className={`btn-3d p-4 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 aspect-square relative ${
                                                    isDone 
                                                    ? 'bg-teal-50 border-teal-200 text-teal-800' 
                                                    : 'bg-white border-slate-200 text-slate-700 shadow-[0_4px_0_#cbd5e1]'
                                                }`}
                                            >
                                                <span className="text-4xl mb-1">{st.icon}</span>
                                                <span className="font-bold text-sm text-center">{st.title}</span>
                                                {isDone && <span className="absolute top-2 right-2 text-green-500 text-lg drop-shadow-md">✅</span>}
                                            </button>
                                        )
                                    })}
                                </div>
                                {completedStages.length === stages.length && (
                                    <button 
                                        onClick={() => setScreen('certificate')}
                                        className="w-full btn-teal btn-3d py-4 rounded-xl font-bold text-xl mt-4 animate-pulse shrink-0"
                                    >
                                        استلمي الشهادة 🎓
                                    </button>
                                )}
                            </div>
                        )}

                        {screen === 'stage' && currentStageId && (
                            <StageEngine 
                                stage={stages.find(s => s.id === currentStageId)} 
                                onComplete={() => markStageComplete(currentStageId)}
                                onBack={() => setScreen('map')}
                            />
                        )}

                        {screen === 'certificate' && (
                            <div className="flex flex-col flex-1 items-center justify-center text-center relative border-8 border-teal-100 bg-white rounded-3xl p-6 shadow-inner h-full">
                                <Confetti />
                                <div className="text-7xl mb-4 drop-shadow-md">🏆</div>
                                <h2 className="text-3xl font-extrabold text-teal-700 mb-2">شهادة تأسيس</h2>
                                <p className="text-slate-500 font-bold mb-6">تُمنح بكل فخر للطالبة المتميزة</p>
                                
                                <div className="bg-teal-50 border-2 border-teal-100 px-8 py-5 rounded-2xl w-full mb-6 shadow-sm transform -rotate-1">
                                    <h3 className="text-4xl font-black text-slate-800">{studentName}</h3>
                                </div>
                                
                                <p className="text-slate-600 font-medium mb-8 text-sm leading-relaxed">
                                    لتعلمها الأرقام بذكاء واجتيازها<br/>مرحلة التأسيس بنجاح! 🌟
                                </p>
                                
                                <div className="w-full flex justify-between items-end mt-auto border-t-2 border-dashed border-teal-200 pt-4 px-2">
                                    <div className="text-right">
                                        <p className="text-xs text-slate-400 mb-1 font-bold">المعلمة:</p>
                                        <p className="signature">عهود حامد الرحيلي</p>
                                    </div>
                                    <div className="bg-amber-100 text-amber-600 p-2 rounded-full shadow-sm">
                                        <span className="text-2xl">🏅</span>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => {
                                        setScreen('welcome');
                                        setCompletedStages([]);
                                        setScore(0);
                                        setStudentName('');
                                    }}
                                    className="absolute -bottom-16 text-teal-700 font-bold bg-white px-6 py-2 rounded-full shadow-md border border-teal-100"
                                >
                                    العب من جديد 🔄
                                </button>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        // Unified Stage Engine that handles interaction and confirmation
        const StageEngine = ({ stage, onComplete, onBack }) => {
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [status, setStatus] = useState('idle'); // idle, correct, wrong
            
            // For counting stages
            const [countedItems, setCountedItems] = useState([]);

            const handleCheck = () => {
                if (selectedOpt === null) return;
                
                if (selectedOpt === stage.answer) {
                    playSound('success');
                    setStatus('correct');
                    setTimeout(() => {
                        onComplete();
                    }, 2000);
                } else {
                    playSound('error');
                    setStatus('wrong');
                    setTimeout(() => setStatus('idle'), 1000);
                }
            };

            const handleItemClick = (index) => {
                if (!countedItems.includes(index)) {
                    playSound('pop');
                    setCountedItems([...countedItems, index]);
                }
            };

            if (stage.type === 'draw') {
                return <DrawStage stage={stage} onComplete={onComplete} onBack={onBack} />
            }

            return (
                <div className="flex flex-col flex-1 items-center relative h-full w-full">
                    {status === 'correct' && <Confetti />}
                    
                    <div className="flex-1 w-full flex flex-col items-center">
                        <div className="w-full flex justify-between items-center mb-4">
                            <button onClick={onBack} className="text-xl bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">🔙</button>
                            <h2 className="text-xl font-bold text-slate-800 text-center flex-1">{stage.title}</h2>
                            <div className="w-10"></div>
                        </div>
                        
                        <p className="text-sm text-slate-600 text-center mb-4 font-bold bg-slate-50 p-4 rounded-2xl w-full border border-slate-100">
                            {stage.question}
                        </p>
                        
                        {/* Visuals rendering based on stage type */}
                        <div className="flex-1 flex flex-col justify-center w-full min-h-[150px]">
                            {stage.type === 'count' && (
                                <div className="flex flex-wrap justify-center gap-4 mb-6 p-4 bg-white rounded-3xl border-2 border-dashed border-teal-200">
                                    {[...Array(stage.targetCount)].map((_, i) => {
                                        const isCounted = countedItems.includes(i);
                                        return (
                                            <div 
                                                key={i} 
                                                onClick={() => handleItemClick(i)}
                                                className={`relative cursor-pointer transition-transform duration-300 text-5xl flex items-center justify-center w-16 h-16 ${isCounted ? 'scale-110' : 'hover:scale-105 animate-bounce'}`}
                                            >
                                                <span className={isCounted ? 'opacity-30' : 'opacity-100'}>{stage.icon}</span>
                                                {isCounted && <span className="absolute text-2xl font-black text-teal-600 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow-md animate-pop">{i + 1}</span>}
                                            </div>
                                        )
                                    })}
                                </div>
                            )}

                            {stage.type === 'visual_mcq' && (
                                <div className="flex justify-around items-end w-full mb-6 gap-2">
                                    {stage.visualsData.map((v, i) => (
                                        <div key={i} className="flex flex-col items-center bg-white p-4 rounded-2xl border-2 border-slate-100 w-1/2">
                                            <div className="text-4xl mb-2">{stage.icon}</div>
                                            <div className="flex flex-wrap justify-center gap-1 w-full mt-2">
                                                {[...Array(v.num)].map((_, idx) => <span key={idx} className="text-xs">{v.emoji}</span>)}
                                            </div>
                                            <div className="mt-2 text-sm font-bold text-slate-400">({v.num})</div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {stage.visuals && (
                                <div className="text-2xl sm:text-3xl mb-6 text-center bg-white p-6 rounded-3xl shadow-sm border-2 border-slate-100 w-full" style={{letterSpacing: '0.1em'}}>
                                    {stage.visuals}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="w-full shrink-0 flex flex-col gap-4 mt-auto">
                        <div className="grid grid-cols-3 gap-3 w-full">
                            {stage.options.map((opt, i) => (
                                <button 
                                    key={i}
                                    onClick={() => {
                                        playSound('click');
                                        setSelectedOpt(opt);
                                    }}
                                    className={`btn-option py-4 rounded-2xl font-bold text-2xl ${selectedOpt === opt ? 'selected' : ''}`}
                                >
                                    {opt}
                                </button>
                            ))}
                        </div>

                        <button 
                            onClick={handleCheck}
                            disabled={selectedOpt === null || status === 'correct'}
                            className={`w-full btn-teal btn-3d py-4 rounded-xl font-bold text-xl ${status === 'wrong' ? 'animate-shake bg-red-500 box-shadow-[0_6px_0_#991b1b]' : ''}`}
                        >
                            {status === 'wrong' ? 'حاولي مرة أخرى ❌' : 'تحقق من إجابتي ✅'}
                        </button>
                    </div>

                    {status === 'correct' && (
                        <div className="absolute inset-0 bg-white/90 flex flex-col items-center justify-center text-4xl font-bold text-green-500 z-40 rounded-2xl backdrop-blur-sm shadow-xl animate-pop">
                            <span>🌟</span>
                            <span className="mt-4">أحسنتِ بطلة!</span>
                        </div>
                    )}
                </div>
            );
        };

        const DrawStage = ({stage, onComplete, onBack}) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [selectedNum, setSelectedNum] = useState(null);

            useEffect(() => {
                if (selectedNum && canvasRef.current && containerRef.current) {
                    const canvas = canvasRef.current;
                    const container = containerRef.current;
                    canvas.width = container.offsetWidth;
                    canvas.height = container.offsetHeight;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = 16;
                    ctx.strokeStyle = '#147971';
                }
            }, [selectedNum]);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const stopDrawing = () => {
                setIsDrawing(false);
                if (canvasRef.current) {
                    canvasRef.current.getContext('2d').beginPath();
                }
            };

            const draw = (e) => {
                if (!isDrawing) return;
                if (e.cancelable) e.preventDefault();
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            return (
                <div className="flex flex-col flex-1 items-center h-full w-full">
                    <div className="w-full flex justify-between items-center mb-2">
                        <button onClick={onBack} className="text-xl bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">🔙</button>
                        <h2 className="text-xl font-bold text-slate-800 text-center flex-1">{stage.title}</h2>
                        <div className="w-10"></div>
                    </div>
                    
                    {!selectedNum ? (
                        <div className="flex-1 flex flex-col w-full overflow-hidden">
                            <p className="text-sm text-slate-500 font-bold text-center mb-4 bg-slate-50 p-3 rounded-xl">{stage.question}</p>
                            <div className="grid grid-cols-3 gap-3 overflow-y-auto p-1 pb-4 flex-1 content-start">
                                {[...Array(9)].map((_, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => {
                                            playSound('click');
                                            setSelectedNum((i+1).toString());
                                        }}
                                        className="btn-option rounded-xl py-6 font-bold text-3xl btn-3d"
                                    >
                                        {i+1}
                                    </button>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col flex-1 w-full items-center h-full">
                            <div className="flex justify-between w-full mb-3 px-1">
                                <button onClick={() => setSelectedNum(null)} className="text-sm text-slate-500 font-bold bg-slate-100 px-4 py-2 rounded-lg">تغيير الرقم</button>
                                <button onClick={clearCanvas} className="text-sm text-red-500 font-bold bg-red-50 px-4 py-2 rounded-lg">مسح 🧹</button>
                            </div>
                            
                            <div ref={containerRef} className="relative bg-white border-4 border-dashed border-teal-200 rounded-3xl w-full flex-1 shadow-inner overflow-hidden touch-none mb-4">
                                <div className="absolute inset-0 flex items-center justify-center text-[160px] font-black text-slate-100 select-none pointer-events-none">
                                    {selectedNum}
                                </div>
                                <canvas 
                                    ref={canvasRef}
                                    className="absolute inset-0 w-full h-full cursor-crosshair z-10"
                                    onMouseDown={startDrawing}
                                    onMouseUp={stopDrawing}
                                    onMouseOut={stopDrawing}
                                    onMouseMove={draw}
                                    onTouchStart={startDrawing}
                                    onTouchEnd={stopDrawing}
                                    onTouchMove={draw}
                                />
                            </div>
                            
                            <button 
                                onClick={() => {
                                    playSound('success');
                                    onComplete();
                                }}
                                className="w-full btn-teal btn-3d py-4 rounded-xl font-bold text-xl shrink-0"
                            >
                                أنهيت الكتابة ✅
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
