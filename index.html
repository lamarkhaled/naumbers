<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدينة الأرقام المرحة - المعلمة عهود حامد الرحيلي</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', 'Fredoka', sans-serif;
            background-color: #ffdeeb; /* playful pink background */
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            background-image: radial-gradient(#ffb6c1 20%, transparent 20%), radial-gradient(#ffb6c1 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }
        
        .game-container {
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.1), inset 0 0 0 10px rgba(255,255,255,0.5);
            border-radius: 40px;
        }

        .btn-game {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom-width: 6px;
        }
        
        .btn-game:active {
            transform: translateY(6px);
            border-bottom-width: 0px;
            margin-top: 6px;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes float-fast {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float-fast { animation: float-fast 2s ease-in-out infinite; }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }
        .animate-pop { animation: pop 0.3s forwards; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }
        .animate-shake { animation: shake 0.4s; }
        
        @keyframes bounce-in {
            0% { transform: scale(0); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            z-index: 0;
        }
    </style>
</head>
<body class="w-full h-[100dvh] flex justify-center items-center p-2 sm:p-4">
    
    <div id="root" class="w-full max-w-md h-full relative game-container overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Sound Manager ---
        const playAudio = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                } else if (type === 'pop') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'crunch') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'wrong') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                }
            } catch(e) { console.log("Audio not ready"); }
        };

        const Confetti = () => (
            <div className="absolute inset-0 pointer-events-none z-50">
                {[...Array(30)].map((_, i) => (
                    <div key={i} className="absolute animate-bounce-in text-3xl"
                         style={{
                            left: `${Math.random() * 100}%`,
                            top: `${Math.random() * 100}%`,
                            animationDelay: `${Math.random() * 0.3}s`
                         }}>
                        {['✨', '🌟', '🎉', '🎈'][Math.floor(Math.random() * 4)]}
                    </div>
                ))}
            </div>
        );

        // --- Mini Games ---

        // Game 1: Feed the Bunny (Counting 1-to-1)
        const FeedBunnyGame = ({ onWin }) => {
            const target = 5;
            const [eaten, setEaten] = useState(0);
            const [carrots, setCarrots] = useState([...Array(8)].map((_, i) => ({ id: i, visible: true })));
            
            const handleFeed = (id) => {
                if (eaten >= target) return;
                playAudio('crunch');
                setCarrots(prev => prev.map(c => c.id === id ? { ...c, visible: false } : c));
                const newEaten = eaten + 1;
                setEaten(newEaten);
                
                if (newEaten === target) {
                    playAudio('success');
                    setTimeout(onWin, 1500);
                }
            };

            return (
                <div className="flex flex-col items-center justify-between h-full w-full py-4 z-10 relative">
                    <div className="bg-white/80 backdrop-blur rounded-3xl p-4 text-center border-4 border-white shadow-lg w-11/12">
                        <h2 className="text-2xl font-black text-pink-500 mb-2">أطعمي الأرنب!</h2>
                        <p className="text-lg font-bold text-slate-700">الأرنب جائع، أطعميه <span className="text-3xl text-pink-600 bg-pink-100 px-3 rounded-xl mx-1">{target}</span> جزرات 🥕</p>
                    </div>
                    
                    <div className="flex-1 flex flex-col justify-center w-full px-6">
                        <div className="flex flex-wrap justify-center gap-4 mb-8">
                            {carrots.map(c => (
                                <button key={c.id} onClick={() => c.visible && handleFeed(c.id)}
                                    className={`text-6xl transition-all duration-300 ${c.visible ? 'animate-bounce cursor-pointer hover:scale-110' : 'opacity-0 scale-0'}`}>
                                    🥕
                                </button>
                            ))}
                        </div>
                        
                        <div className="relative flex justify-center items-end mt-4">
                            <div className={`text-9xl z-10 transition-transform ${eaten > 0 ? 'animate-bounce-in' : 'animate-float'}`}>
                                {eaten >= target ? '🐰💖' : '🐰'}
                            </div>
                            <div className="absolute -bottom-4 w-48 h-12 bg-black/10 rounded-[100%] blur-sm z-0"></div>
                            
                            {/* Counter display next to bunny */}
                            <div className="absolute -right-4 top-0 bg-white border-4 border-pink-400 rounded-full w-16 h-16 flex items-center justify-center text-3xl font-black text-pink-500 shadow-lg z-20">
                                {eaten}
                            </div>
                        </div>
                    </div>
                    {eaten >= target && <Confetti />}
                </div>
            );
        };

        // Game 2: Pop the Balloon (Number Recognition/Comparison)
        const PopBalloonGame = ({ onWin }) => {
            const [balloons, setBalloons] = useState([
                { id: 1, num: 3, color: 'bg-red-400', popped: false, error: false },
                { id: 2, num: 8, color: 'bg-blue-400', popped: false, error: false },
                { id: 3, num: 5, color: 'bg-yellow-400', popped: false, error: false },
                { id: 4, num: 2, color: 'bg-purple-400', popped: false, error: false }
            ]);
            const targetNum = 8;

            const handlePop = (id, num) => {
                if (num === targetNum) {
                    playAudio('pop');
                    setBalloons(prev => prev.map(b => b.id === id ? { ...b, popped: true } : b));
                    setTimeout(() => {
                        playAudio('success');
                        onWin();
                    }, 800);
                } else {
                    playAudio('wrong');
                    setBalloons(prev => prev.map(b => b.id === id ? { ...b, error: true } : b));
                    setTimeout(() => {
                        setBalloons(prev => prev.map(b => b.id === id ? { ...b, error: false } : b));
                    }, 400);
                }
            };

            return (
                <div className="flex flex-col items-center h-full w-full py-4 z-10 relative">
                    <div className="bg-white/80 backdrop-blur rounded-3xl p-4 text-center border-4 border-white shadow-lg w-11/12 z-20">
                        <h2 className="text-2xl font-black text-blue-500 mb-2">فرقعة البالونات!</h2>
                        <p className="text-lg font-bold text-slate-700">ابحثي عن الرقم <span className="text-3xl text-blue-600 bg-blue-100 px-3 rounded-xl mx-1">{targetNum}</span> وفقعيه 🎈</p>
                    </div>
                    
                    <div className="flex-1 w-full relative flex justify-center items-center">
                        <div className="grid grid-cols-2 gap-8 p-6 w-full">
                            {balloons.map((b, i) => (
                                <div key={b.id} className="flex justify-center">
                                    {!b.popped && (
                                        <button 
                                            onClick={() => handlePop(b.id, b.num)}
                                            className={`relative w-28 h-32 rounded-[50%] ${b.color} shadow-inner flex items-center justify-center border-b-4 border-black/20 ${b.error ? 'animate-shake' : (i%2===0 ? 'animate-float' : 'animate-float-fast')}`}
                                            style={{ borderBottomLeftRadius: '50% 60%', borderBottomRightRadius: '50% 60%' }}
                                        >
                                            <span className="text-5xl font-black text-white drop-shadow-md">{b.num}</span>
                                            {/* Balloon knot */}
                                            <div className="absolute -bottom-3 w-4 h-4 bg-inherit rotate-45"></div>
                                        </button>
                                    )}
                                    {b.popped && <div className="text-6xl animate-pop">💥</div>}
                                </div>
                            ))}
                        </div>
                    </div>
                    {balloons.find(b => b.popped) && <Confetti />}
                </div>
            );
        };

        // Game 3: Apple Basket (Simple Addition/Interactive Placement)
        const AppleBasketGame = ({ onWin }) => {
            const target = 4;
            const [apples, setApples] = useState([...Array(6)].map((_, i) => ({ id: i, inBasket: false })));
            
            const applesInBasket = apples.filter(a => a.inBasket).length;

            const handlePick = (id) => {
                if (applesInBasket >= target) return;
                playAudio('click');
                setApples(prev => prev.map(a => a.id === id ? { ...a, inBasket: true } : a));
                
                if (applesInBasket + 1 === target) {
                    setTimeout(() => {
                        playAudio('success');
                        onWin();
                    }, 500);
                }
            };

            return (
                <div className="flex flex-col items-center h-full w-full py-4 z-10 relative">
                    <div className="bg-white/80 backdrop-blur rounded-3xl p-4 text-center border-4 border-white shadow-lg w-11/12 mb-4 z-20">
                        <h2 className="text-2xl font-black text-red-500 mb-2">جمع التفاح!</h2>
                        <p className="text-lg font-bold text-slate-700">ضعي <span className="text-3xl text-red-600 bg-red-100 px-3 rounded-xl mx-1">{target}</span> تفاحات في السلة 🧺</p>
                    </div>
                    
                    {/* Tree */}
                    <div className="relative w-full flex-1 flex flex-col items-center justify-between">
                        <div className="relative w-64 h-64 bg-green-500 rounded-full border-8 border-green-600 shadow-lg flex flex-wrap justify-center items-center p-4">
                            {apples.map(a => (
                                !a.inBasket && (
                                    <button key={a.id} onClick={() => handlePick(a.id)} className="text-5xl animate-float-fast p-2 hover:scale-125 transition-transform">
                                        🍎
                                    </button>
                                )
                            ))}
                            <div className="absolute -bottom-16 w-12 h-20 bg-amber-800 rounded-lg -z-10"></div>
                        </div>
                        
                        {/* Basket */}
                        <div className="relative mt-8 mb-4">
                            <div className="text-8xl">🧺</div>
                            <div className="absolute inset-0 flex flex-wrap-reverse justify-center items-end pb-4 px-2 gap-1 pointer-events-none">
                                {apples.filter(a => a.inBasket).map(a => (
                                    <div key={a.id} className="text-3xl animate-bounce-in">🍎</div>
                                ))}
                            </div>
                            <div className="absolute -right-6 top-1/2 bg-white border-4 border-red-400 rounded-full w-12 h-12 flex items-center justify-center text-2xl font-black text-red-500 shadow-lg z-20">
                                {applesInBasket}
                            </div>
                        </div>
                    </div>
                    {applesInBasket >= target && <Confetti />}
                </div>
            );
        };


        // --- Main App ---
        const App = () => {
            const [screen, setScreen] = useState('welcome');
            const [studentName, setStudentName] = useState('');
            const [completedGames, setCompletedGames] = useState([]);
            const [currentGame, setCurrentGame] = useState(null);

            const games = [
                { id: 'bunny', title: 'الأرنب الجائع', icon: '🐰', color: 'bg-pink-400', border: 'border-pink-500' },
                { id: 'balloon', title: 'فرقعة البالونات', icon: '🎈', color: 'bg-blue-400', border: 'border-blue-500' },
                { id: 'apple', title: 'سلة التفاح', icon: '🍎', color: 'bg-green-400', border: 'border-green-500' }
            ];

            const startGame = () => {
                playAudio('click');
                if (studentName.trim()) setScreen('map');
            };

            const openGame = (id) => {
                playAudio('click');
                setCurrentGame(id);
                setScreen('play');
            };

            const handleWin = () => {
                if (!completedGames.includes(currentGame)) {
                    setCompletedGames([...completedGames, currentGame]);
                }
                setTimeout(() => setScreen('map'), 2000);
            };

            return (
                <div className="w-full h-full relative flex flex-col bg-sky-100 rounded-[40px] overflow-hidden">
                    {/* Background decorations */}
                    <div className="cloud w-32 h-12 top-10 -left-10 opacity-60"></div>
                    <div className="cloud w-40 h-16 top-32 right-[-20px] opacity-40"></div>
                    
                    {/* Header */}
                    {screen !== 'welcome' && screen !== 'certificate' && (
                        <div className="w-full bg-white/70 backdrop-blur-md p-4 flex justify-between items-center z-20 shadow-sm rounded-t-[40px]">
                            <div className="font-black text-xl text-sky-600">مدينة الأرقام 🎡</div>
                            <div className="flex gap-1">
                                {games.map(g => (
                                    <div key={g.id} className={`w-8 h-8 rounded-full flex items-center justify-center text-sm ${completedGames.includes(g.id) ? g.color + ' text-white' : 'bg-slate-200 text-transparent'}`}>
                                        {completedGames.includes(g.id) ? '⭐' : ''}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Screens */}
                    <div className="flex-1 w-full relative overflow-hidden flex flex-col">
                        
                        {screen === 'welcome' && (
                            <div className="flex-1 flex flex-col items-center justify-center p-6 z-10">
                                <div className="text-8xl mb-6 animate-float">🧸</div>
                                <h1 className="text-4xl font-black text-sky-600 text-center mb-2 leading-tight drop-shadow-sm">
                                    مدينة الأرقام<br/>المرحة!
                                </h1>
                                <p className="text-slate-600 font-bold mb-8">إعداد: المعلمة عهود حامد الرحيلي</p>
                                
                                <div className="w-full bg-white p-6 rounded-[30px] shadow-xl border-4 border-white">
                                    <label className="block text-center font-bold text-slate-500 mb-3 text-lg">يا بطلة، ما اسمك؟</label>
                                    <input 
                                        type="text" 
                                        value={studentName}
                                        onChange={e => setStudentName(e.target.value)}
                                        className="w-full bg-slate-50 border-4 border-sky-100 rounded-2xl p-4 text-center text-2xl font-black text-slate-700 focus:outline-none focus:border-sky-300 mb-4"
                                        placeholder="اكتبي اسمك..."
                                    />
                                    <button 
                                        onClick={startGame}
                                        disabled={!studentName.trim()}
                                        className="w-full bg-yellow-400 border-yellow-500 text-yellow-900 btn-game py-4 rounded-2xl font-black text-2xl disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        يلا نلعب! 🚀
                                    </button>
                                </div>
                            </div>
                        )}

                        {screen === 'map' && (
                            <div className="flex-1 flex flex-col p-6 z-10">
                                <h2 className="text-2xl font-black text-center text-slate-700 mb-6 bg-white/80 rounded-2xl py-3">أهلاً يا {studentName}! اختاري لعبة:</h2>
                                
                                <div className="flex flex-col gap-4 flex-1 justify-center">
                                    {games.map(game => {
                                        const isDone = completedGames.includes(game.id);
                                        return (
                                            <button 
                                                key={game.id}
                                                onClick={() => openGame(game.id)}
                                                className={`btn-game w-full p-6 rounded-3xl flex items-center justify-between border-4 bg-white relative overflow-hidden ${isDone ? 'opacity-80' : ''} ${game.border}`}
                                            >
                                                <div className="flex items-center gap-4 relative z-10">
                                                    <div className={`w-16 h-16 rounded-2xl ${game.color} flex items-center justify-center text-4xl shadow-inner`}>
                                                        {game.icon}
                                                    </div>
                                                    <span className="text-2xl font-black text-slate-700">{game.title}</span>
                                                </div>
                                                {isDone && <div className="text-4xl animate-bounce-in z-10">🌟</div>}
                                                
                                                {/* Decorative background shape */}
                                                <div className={`absolute -right-10 -top-10 w-32 h-32 rounded-full opacity-10 ${game.color}`}></div>
                                            </button>
                                        )
                                    })}
                                </div>

                                {completedGames.length === games.length && (
                                    <button 
                                        onClick={() => { playAudio('success'); setScreen('certificate'); }}
                                        className="mt-6 bg-purple-500 border-purple-600 text-white btn-game py-5 rounded-3xl font-black text-2xl animate-pulse"
                                    >
                                        استلمي هديتك! 🎁
                                    </button>
                                )}
                            </div>
                        )}

                        {screen === 'play' && (
                            <div className="flex-1 relative overflow-hidden bg-cover bg-center">
                                {/* Back button */}
                                <button onClick={() => setScreen('map')} className="absolute top-6 right-6 z-50 bg-white/80 backdrop-blur w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold shadow-md hover:scale-110 transition-transform">
                                    ❌
                                </button>
                                
                                {currentGame === 'bunny' && <FeedBunnyGame onWin={handleWin} />}
                                {currentGame === 'balloon' && <PopBalloonGame onWin={handleWin} />}
                                {currentGame === 'apple' && <AppleBasketGame onWin={handleWin} />}
                            </div>
                        )}

                        {screen === 'certificate' && (
                            <div className="flex-1 flex flex-col items-center justify-center p-6 z-10 bg-gradient-to-b from-purple-100 to-pink-100">
                                <Confetti />
                                <div className="bg-white p-8 rounded-[40px] shadow-2xl border-8 border-purple-300 text-center relative w-full mt-10">
                                    <div className="absolute -top-16 left-1/2 transform -translate-x-1/2 text-8xl drop-shadow-lg">👑</div>
                                    
                                    <h2 className="text-3xl font-black text-purple-600 mt-8 mb-2">أنتِ بطلة الأرقام!</h2>
                                    <p className="text-lg font-bold text-slate-500 mb-6">تهانينا للطالبة الذكية جداً</p>
                                    
                                    <div className="bg-purple-100 border-4 border-purple-200 py-4 px-6 rounded-2xl mb-8 transform -rotate-2">
                                        <h3 className="text-4xl font-black text-purple-800">{studentName}</h3>
                                    </div>
                                    
                                    <div className="flex justify-between items-center border-t-4 border-dashed border-purple-100 pt-6">
                                        <div className="text-right">
                                            <p className="text-sm font-bold text-slate-400">معلمتك فخورة بك:</p>
                                            <p className="text-xl font-black text-purple-500 mt-1">عهود حامد الرحيلي</p>
                                        </div>
                                        <div className="text-5xl">🏅</div>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => {
                                        setScreen('map');
                                        setCompletedGames([]);
                                    }}
                                    className="mt-8 bg-white text-purple-600 font-black px-8 py-3 rounded-full shadow-lg border-2 border-purple-100"
                                >
                                    نلعب مرة ثانية؟ 🔄
                                </button>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
